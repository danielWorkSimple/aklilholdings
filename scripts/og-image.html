<!doctype html>
<!--
  Source of public/images/og-default.png, the 1200x630 link preview image
  (WhatsApp, LinkedIn, Telegram). Same colors, fonts and wordmark as the site.
  To regenerate after a change, from the repo root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=public/images/og-default.png scripts/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    color: #fff;
    background: linear-gradient(to bottom right, #0f172a 0%, #1a2744 50%, #1e293b 100%);
  }
  .glow-gold {
    position: absolute; top: 70px; left: 40px; width: 380px; height: 380px;
    border-radius: 50%; background: rgba(201, 162, 39, 0.07); filter: blur(70px);
  }
  .glow-navy {
    position: absolute; bottom: 30px; right: 30px; width: 460px; height: 460px;
    border-radius: 50%; background: rgba(36, 51, 82, 0.45); filter: blur(70px);
  }
  .card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding-bottom: 36px;
  }
  .icon {
    width: 88px; height: 88px; border-radius: 50%;
    background: rgba(201, 162, 39, 0.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 34px;
  }
  .icon svg { width: 44px; height: 44px; }
  h1 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 108px; line-height: 1; letter-spacing: 0.01em;
  }
  h1 span {
    background: linear-gradient(135deg, #c9a227 0%, #d4b23a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rule { width: 96px; height: 3px; border-radius: 2px; background: #c9a227; margin: 34px 0 30px; }
  .tagline { font-size: 36px; font-weight: 300; color: #e2e8f0; line-height: 1.3; }
  .tagline b { color: #c9a227; font-weight: 600; }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 42px;
    text-align: center; font-size: 22px; font-weight: 500; color: #94a3b8; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="glow-gold"></div>
  <div class="glow-navy"></div>
  <div class="card">
    <div class="icon">
      <!-- lucide building-2, the icon in the site's hero -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/>
        <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
        <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/>
      </svg>
    </div>
    <h1>AKLIL <span>HOLDINGS</span></h1>
    <div class="rule"></div>
    <p class="tagline">Building Ethiopia's Future Through <b>Strategic Investments</b></p>
  </div>
  <p class="footer">aklilholdings.com &nbsp;·&nbsp; Addis Ababa, Ethiopia</p>
</body>
</html>
